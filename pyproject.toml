[project]
name = "rankeddojo"
version = "1.0.0"
description = "Local-first desktop app for programming practice and exam simulation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "reginaldojr-dev", email = "116604100+reginaldojr-dev@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "markdown-it-py>=3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
[project.urls]
Repository = "https://github.com/reginaldojr-dev/rankeddojo"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
rankeddojo = "rankeddojo.main:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rankeddojo = ["resources/*.md", "resources/packs/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_classes = ["*Test"]

